services:
  postgres:
    image: postgres:16-alpine
    container_name: etf-oracle-postgres
    environment:
      POSTGRES_USER: etf
      POSTGRES_PASSWORD: etf_dev
      POSTGRES_DB: etf_oracle
    ports:
      - "5432:5432"
    volumes:
      - etf_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etf -d etf_oracle"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: etf-oracle-redis
    ports:
      - "6379:6379"
    volumes:
      - etf_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  etf_pg_data:
  etf_redis_data:
